<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy demo</title>
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --fg: #1c1c1a; --muted: #6a6a64; --line: #e3e1da; --accent: #2f5fd0;
    --hear: #2f6fd6; --understand: #8248c9; --decide: #d07a12; --see: #2a8f4b; --plan: #128a8a; --act: #cf3f2f;
    --sense: #c2387f; --check: #2f7d32; --say: #55554f; --system: #8a8a84;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --fg: #ecebe6; --muted: #9b9a93; --line: #33322e; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .chip b { color: var(--fg); }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; padding: 14px 18px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  img { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; }
  .views { display: grid; grid-template-columns: 1fr; gap: 14px; }
  #chat { height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 7px 11px; border-radius: 12px; }
  .msg.Buddy { background: color-mix(in srgb, var(--accent) 14%, var(--card)); align-self: flex-start; }
  .msg.Player { background: color-mix(in srgb, var(--fg) 8%, var(--card)); align-self: flex-end; }
  .msg small { display: block; color: var(--muted); font-size: 11px; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  input[type=text] { flex: 1; min-width: 0; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  button { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  #trace { height: 330px; overflow-y: auto; font-size: 13px; }
  .row { display: grid; grid-template-columns: 46px 96px 1fr; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .row .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: #fff; border-radius: 4px; padding: 1px 6px; height: fit-content; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; gap: 5px; align-items: center; }
  .scene { display: flex; flex-wrap: wrap; gap: 8px; }
  .meter { display: inline-block; width: 60px; height: 6px; background: var(--line); border-radius: 3px; vertical-align: middle; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--hear); }
</style>
</head>
<body>
<header>
  <h1>Buddy · noughts and crosses</h1>
  <span class="chip">state <b id="state">…</b></span>
  <span class="chip" id="speak">voice idle</span>
  <span class="chip" id="mic">mic …</span>
  <span class="chip">arm <b id="arm">…</b></span>
  <span class="chip">pen touch <b id="touch">0</b> N</span>
  <span class="chip">sheet <b id="sheet">…</b></span>
</header>
<main>
  <div class="col">
    <div class="card"><h2>What Buddy sees: overhead camera, read with OpenCV</h2><img id="overhead" alt="overhead camera with perception overlay"></div>
    <div class="card"><h2>The arm (MuJoCo simulation)</h2><img id="scene" alt="3/4 view of the SO-101 arm"></div>
  </div>
  <div class="col">
    <div class="card">
      <h2>Conversation</h2>
      <div id="chat"></div>
      <form id="say"><input type="text" id="text" placeholder="Type what you'd say, e.g. Buddy, let's play a game" autocomplete="off"><button class="primary">Say</button></form>
      <div style="margin-top:8px"><button id="micbtn" type="button">Mute mic</button></div>
    </div>
    <div class="card">
      <h2>How Buddy decided: every step, in order</h2>
      <div id="trace"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h2>Change the scene (live)</h2>
      <div class="scene">
        <button data-a="new_sheet">New blank sheet</button>
        <button data-a="slide">Slide the sheet</button>
        <button data-a="rotate">Rotate the sheet</button>
        <button data-a="far">Push it out of reach</button>
        <button data-a="remove">Take the sheet away</button>
        <button data-a="back">Put it back</button>
      </div>
    </div>
  </div>
</main>
<script>
const STAGES = {
  hear: "microphone → Silero VAD → Whisper, or keyboard", understand: "phrase rules first, Gemma 3 4B when unsure",
  decide: "state machine", see: "overhead camera + OpenCV", plan: "grid on the sheet + IK reach check",
  act: "arm controller", sense: "pen-tip touch sensor", check: "camera verifies the ink", say: "Kokoro voice",
  system: "start-up and scene changes" };
const color = s => getComputedStyle(document.documentElement).getPropertyValue("--" + s).trim() || "#888";
document.getElementById("legend").innerHTML = Object.entries(STAGES).map(([k, v]) =>
  `<span><i class="badge" style="background:${color(k)}">${k.toUpperCase()}</i>${v}</span>`).join("");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let nTrace = -1, nChat = -1, micOn = true;

function refreshImg(id, url) {
  const im = new Image();
  im.onload = () => { document.getElementById(id).src = im.src; };
  im.src = url + "?t=" + Date.now();
}
setInterval(() => { refreshImg("overhead", "overhead.jpg"); refreshImg("scene", "scene.jpg"); }, 250);

async function tick() {
  let s;
  try { s = await (await fetch("state.json", { cache: "no-store" })).json(); } catch (e) { return; }
  document.getElementById("state").textContent = s.state;
  document.getElementById("arm").textContent = s.arm;
  document.getElementById("touch").textContent = s.touch_N.toFixed(2);
  document.getElementById("sheet").textContent = s.sheet ? `${s.sheet.x_cm}, ${s.sheet.y_cm} cm · ${s.sheet.rot_deg}° · conf ${s.sheet.conf}` : "not seen";
  const sp = document.getElementById("speak"); sp.textContent = s.speaking ? "Buddy is speaking" : "voice idle"; sp.classList.toggle("on", s.speaking);
  const mic = document.getElementById("mic");
  if (!s.mic.available) { mic.textContent = "mic off: type below"; }
  else { micOn = s.mic.enabled; mic.innerHTML = (micOn ? "listening " : "mic muted ") + `<span class="meter"><i style="width:${Math.min(100, s.mic.level * 1500)}%"></i></span>`;
         document.getElementById("micbtn").textContent = micOn ? "Mute mic" : "Unmute mic"; }
  if (s.trace.length && s.trace[s.trace.length - 1].t !== nTrace) {
    nTrace = s.trace[s.trace.length - 1].t;
    const el = document.getElementById("trace");
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.innerHTML = s.trace.map(r => `<div class="row"><span class="t">${r.t.toFixed(1)}s</span><span class="badge" style="background:${color(r.stage)}" title="${esc(STAGES[r.stage] || "")}">${r.stage.toUpperCase()}</span><span>${esc(r.msg)}</span></div>`).join("");
    if (atBottom) el.scrollTop = el.scrollHeight;
  }
  if (s.transcript.length !== nChat) {
    nChat = s.transcript.length;
    const el = document.getElementById("chat");
    el.innerHTML = s.transcript.map(m => `<div class="msg ${m.who}"><small>${m.who} · ${m.t.toFixed(1)}s</small>${esc(m.text)}</div>`).join("");
    el.scrollTop = el.scrollHeight;
  }
}
setInterval(tick, 400); tick();

document.getElementById("say").addEventListener("submit", async e => {
  e.preventDefault();
  const t = document.getElementById("text"); if (!t.value.trim()) return;
  await fetch("say", { method: "POST", body: JSON.stringify({ text: t.value }) }); t.value = "";
});
document.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () =>
  fetch("scene", { method: "POST", body: JSON.stringify({ action: b.dataset.a }) })));
document.getElementById("micbtn").addEventListener("click", () =>
  fetch("mic", { method: "POST", body: JSON.stringify({ enabled: !micOn }) }));
</script>
</body>
</html>
