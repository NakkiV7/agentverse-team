[project]
name = "buddy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
